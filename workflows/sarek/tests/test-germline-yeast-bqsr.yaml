# Test input: Germline variant calling with BQSR
# Same as test-germline-yeast.yaml but with known_sites to enable BQSR
fastq_fwd:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
fastq_rev:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
sample_ids:
  - yeast_germline
genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa
known_sites:
  - class: File
    path: ../../../test-data/yeast/known_sites.vcf.gz
trimmer: fastp
