# Test input: Germline variant calling with yeast simulated reads
# Uses RNA-seq reads — variants called are not biologically meaningful
# but the pipeline mechanics are fully tested (no BQSR, no dbSNP)
fastq_fwd:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
fastq_rev:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
sample_ids:
  - yeast_germline
genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa
trimmer: fastp
