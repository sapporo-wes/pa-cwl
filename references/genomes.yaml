# Verified genome reference catalog for pa-cwl workflows
# All URLs and paths have been verified to be accessible as of the verified_date.
# Ensembl release 115 for main Ensembl organisms; Ensembl Plants release 62 for Arabidopsis.
# iGenomes paths reference s3://ngi-igenomes (publicly accessible, no credentials required).

# --- Tier 1: Human, Mouse, Yeast ---

- organism: Homo sapiens
  taxonomy_id: 9606
  assembly: GRCh38
  ensembl_release: 115
  verified_date: "2026-03-27"
  sources:
    ensembl:
      fasta: https://ftp.ensembl.org/pub/release-115/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz
      gtf: https://ftp.ensembl.org/pub/release-115/gtf/homo_sapiens/Homo_sapiens.GRCh38.115.gtf.gz
    igenomes:
      base: s3://ngi-igenomes/igenomes/Homo_sapiens/GATK/GRCh38/
      bwa_index: Sequence/BWAIndex/
      bwamem2_index: Sequence/BWAmem2Index/
      dragmap: Sequence/dragmap/
      # Note: STARIndex directory exists but is empty; build from FASTA+GTF

- organism: Mus musculus
  taxonomy_id: 10090
  assembly: GRCm39
  ensembl_release: 115
  verified_date: "2026-03-27"
  sources:
    ensembl:
      fasta: https://ftp.ensembl.org/pub/release-115/fasta/mus_musculus/dna/Mus_musculus.GRCm39.dna.primary_assembly.fa.gz
      gtf: https://ftp.ensembl.org/pub/release-115/gtf/mus_musculus/Mus_musculus.GRCm39.115.gtf.gz
    igenomes:
      # Note: iGenomes only has GRCm38, not GRCm39
      base: s3://ngi-igenomes/igenomes/Mus_musculus/Ensembl/GRCm38/
      igenomes_assembly: GRCm38
      bwa_index: Sequence/BWAIndex/
      bowtie2_index: Sequence/Bowtie2Index/
      bismark_index: Sequence/BismarkIndex/
      star_index: Sequence/STARIndex/

