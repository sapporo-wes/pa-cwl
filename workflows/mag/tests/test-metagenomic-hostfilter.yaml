# Test: MAG with host read removal (v1.1 feature)
# Uses yeast Bowtie2 index as stand-in host genome

fastq_fwd:
  - class: File
    path: ../../../test-data/metagenome/sample1_R1.fastq.gz

fastq_rev:
  - class: File
    path: ../../../test-data/metagenome/sample1_R2.fastq.gz

sample_ids:
  - sample1

min_contig_len: 500

host_index_files:
  - class: File
    path: ../../../test-data/yeast/bt2_index.1.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.2.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.3.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.4.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.rev.1.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.rev.2.bt2
host_index_base: bt2_index
