# Test input: STAR + Salmon multi-sample (2 samples, same data)
# Uses the same FASTQ files as two "samples" to test scatter logic
fastq_fwd:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
fastq_rev:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
sample_ids:
  - sample_A
  - sample_B
genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa
gtf:
  class: File
  path: ../../../test-data/yeast/genes.gtf
transcriptome_fasta:
  class: File
  path: ../../../test-data/yeast/transcriptome.fa
aligner: star
quantifier: salmon
trimmer: fastp
strandedness: unstranded
