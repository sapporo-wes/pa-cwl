# Test input: STAR + RSEM with simulated yeast RNA-seq reads
fastq_fwd:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
fastq_rev:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
sample_ids:
  - yeast_sim
genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa
gtf:
  class: File
  path: ../../../test-data/yeast/genes.gtf
aligner: star
quantifier: rsem
trimmer: fastp
strandedness: unstranded
