# Test input: Joint germline calling with gVCF + GenomicsDBImport
# Uses emit_gvcf=true and a BED intervals file
fastq_fwd:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
fastq_rev:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
sample_ids:
  - yeast_germline
genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa
emit_gvcf: true
cohort_id: yeast_cohort
intervals:
  class: File
  path: ../../../test-data/yeast/intervals.bed
trimmer: fastp
