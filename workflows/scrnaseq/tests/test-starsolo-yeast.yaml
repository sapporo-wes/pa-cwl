# Test: STARsolo with simulated yeast scRNA-seq data (10x v3 format)

fastq_barcode:
  - class: File
    path: ../../../test-data/yeast/yeast_scrna_R1.fastq.gz

fastq_cdna:
  - class: File
    path: ../../../test-data/yeast/yeast_scrna_R2.fastq.gz

sample_ids:
  - yeast_scrna

genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa

gtf:
  class: File
  path: ../../../test-data/yeast/genes.gtf

barcode_whitelist:
  class: File
  path: ../../../test-data/yeast/barcode_whitelist.txt

# 10x v3 protocol settings
cb_len: 16
umi_len: 12
solo_strand: "Forward"

# For yeast: small genome needs adjusted index parameter
genome_sa_index_nbases: 10

# Disable cell filtering for test (too few reads for real filtering)
solo_cell_filter: "None"
