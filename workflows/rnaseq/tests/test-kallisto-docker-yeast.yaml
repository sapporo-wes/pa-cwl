# Test input: Kallisto (Docker) with simulated yeast RNA-seq reads
# Pre-built index provided to skip slow index build under Rosetta emulation
fastq_fwd:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
fastq_rev:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
sample_ids:
  - yeast_sim
genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa
gtf:
  class: File
  path: ../../../test-data/yeast/genes.gtf
transcriptome_fasta:
  class: File
  path: ../../../test-data/yeast/transcriptome.fa
kallisto_index:
  class: File
  path: /tmp/kallisto_yeast.idx
aligner: star
quantifier: kallisto
trimmer: fastp
strandedness: unstranded
