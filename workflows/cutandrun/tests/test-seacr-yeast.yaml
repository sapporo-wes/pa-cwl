# Test: CUT&RUN with SEACR peak calling + fragment size QC (v1.1 features)
fastq_fwd:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R1.fastq.gz
fastq_rev:
  - class: File
    path: ../../../test-data/yeast/yeast_sim_R2.fastq.gz
sample_ids:
  - yeast_cutandrun
genome_fasta:
  class: File
  path: ../../../test-data/yeast/genome.fa
bowtie2_index_files:
  - class: File
    path: ../../../test-data/yeast/bt2_index.1.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.2.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.3.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.4.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.rev.1.bt2
  - class: File
    path: ../../../test-data/yeast/bt2_index.rev.2.bt2
bowtie2_index_base: bt2_index
genome_size: "1.2e7"
peak_type: narrow
run_seacr: true
seacr_mode: "stringent"
seacr_threshold: 0.01
run_fragment_qc: true
